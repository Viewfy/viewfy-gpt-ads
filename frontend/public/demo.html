<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Viewfy demo</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b0a;--ink:#f4efe6;--gold:#e8c36a;--mut:#a39c92;--dim:#6b6560;--line:rgba(255,255,255,.09);--card:#141210}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Hanken Grotesk",system-ui,sans-serif;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
nav{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex-shrink:0;z-index:5;background:rgba(12,11,10,.9);backdrop-filter:blur(8px)}
nav .logo{display:flex;align-items:center;gap:8px;font-family:"Hanken Grotesk";font-weight:800;font-size:18px;letter-spacing:-.045em;text-decoration:none}
nav .logo img{width:26px;height:26px;border-radius:7px}
nav #title{font-family:"Hanken Grotesk";font-weight:700;font-size:15px;color:var(--mut)}
nav .mock{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(232,195,106,.35);border-radius:99px;padding:3px 9px}
nav .co{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 12px}
nav .co span{color:var(--dim);font-size:12px}
nav .co input{background:none;border:0;outline:0;width:130px;font-weight:600;color:var(--ink)}
nav .co button{background:var(--gold);color:var(--bg);font-weight:700;border-radius:99px;padding:6px 13px;font-size:13px}
nav .co button:hover{background:#f0d48a}
nav #fit{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
nav .ins-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);border:1px solid rgba(232,195,106,.4);border-radius:99px;padding:5px 12px 5px 8px;background:rgba(232,195,106,.08)}
nav .ins-btn:hover{background:rgba(232,195,106,.16)}
nav .ins-btn span{background:var(--gold);color:var(--bg);border-radius:99px;padding:0 7px;font-size:11px;line-height:18px}
.ins{border-left:3px solid var(--c)}
.ins header{gap:8px}
.ins header em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c)}
.ins header .impact{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.ins>b{display:block;margin-top:8px;font-family:"Hanken Grotesk";font-size:15px;line-height:1.3;letter-spacing:-.01em}
.ins p{color:var(--mut)}
.ins footer{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ins footer button{background:var(--gold);color:var(--bg);font-weight:700;border-radius:8px;padding:6px 12px;font-size:12px}
.ins footer button.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
.ins .who{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);font-weight:600}
.ins .who .fav{width:16px;height:16px}
.ev{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.ev td{padding:3px 0;border-top:1px solid var(--line);vertical-align:top}
.ev td:first-child{color:var(--dim);width:46%;padding-right:8px}
.ev td:last-child{color:rgba(244,239,230,.9);font-weight:600}
.ins .src{display:block;margin-top:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.list.mine article{border-color:rgba(232,195,106,.45);box-shadow:0 0 0 1px rgba(232,195,106,.15)}
.ad.draft .status{color:var(--gold);border-color:rgba(232,195,106,.4)}
.outline{margin:8px 0 0;padding-left:18px;font-size:13px;color:rgba(244,239,230,.85)}.outline li{margin:3px 0}
.back{display:inline-flex;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px}.back:hover{color:var(--ink)}
nav #fit:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
#map{position:relative;flex:1;min-height:0}
#canvas{display:block;cursor:grab;touch-action:none}
#canvas:active{cursor:grabbing}
.card{position:absolute;z-index:4;background:rgba(12,11,10,.82);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px)}
#side{left:16px;top:16px;width:300px;padding:16px 16px 12px}
#side h1{margin:0;font-size:22px;font-weight:800;line-height:1.1}
#side p{margin:6px 0 0;color:var(--mut);font-size:13px}
#search{width:100%;margin-top:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:0}
#search:focus{border-color:rgba(255,255,255,.3)}
#filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.f{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:5px 10px;transition:.15s}
.f i{width:7px;height:7px;border-radius:99px;background:var(--c,#fff)}
.f span{color:var(--dim);font-weight:500}
.f:hover{color:var(--ink)}
.f.on{color:var(--ink);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
#side .hint{font-size:11px;color:var(--dim);margin-top:12px}
#side .lanes-h{margin-top:12px}
#lanes{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.f .ico{width:16px;height:16px;border-radius:5px}
.f.sm{font-size:11px;padding:3px 8px}
.f.on{box-shadow:inset 0 0 0 1px var(--c,rgba(255,255,255,.25))}
#tip{position:absolute;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(12,11,10,.94);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:260px;font-size:12px;line-height:1.35}
#tip.show{opacity:1}
#tip b{display:block;font-family:"Hanken Grotesk";font-size:13px}
#tip span{color:var(--mut)}
.ico{vertical-align:middle;border-radius:6px;flex-shrink:0}
.fav{position:relative;display:inline-flex;flex-shrink:0;vertical-align:middle;border-radius:99px;overflow:hidden}
.fav .ico{position:absolute;inset:0;width:100%;height:100%}
.fav>img:first-child{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;padding:14%;box-sizing:border-box;background:#141210;border-radius:99px}
.crumbs{display:flex;align-items:center;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.crumbs .chip{padding:3px 8px 3px 4px;font-size:11px;border-radius:99px}
.crumbs .chip small{display:none}
.crumbs i{color:var(--dim);font-style:normal}
h2 .ico,h2 .fav{border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:8px;text-align:left;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;background:rgba(255,255,255,.03);transition:.15s;min-width:0}
.chip span{display:flex;flex-direction:column;min-width:0}
.chip b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.me{color:var(--gold);background:rgba(232,195,106,.14)}
.tag.src{color:#6ee7b7;background:rgba(110,231,183,.1)}
mark{background:rgba(240,113,103,.2);color:var(--ink);border-radius:3px;padding:0 3px}
mark.me{background:rgba(232,195,106,.28)}
.facts.big{gap:6px 16px;font-size:13px;color:var(--mut);margin-top:12px}
.facts.big li{display:flex;align-items:center;gap:6px}
.facts.big i{width:9px;height:9px;border-radius:99px;display:inline-block}
.thread header{align-items:flex-start}
.thread .score{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--c);color:var(--c);font:800 13px "Hanken Grotesk";display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.thread header em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.thread.brief{cursor:pointer}
.thread.brief:hover{border-color:rgba(255,255,255,.3)}
.draft{margin-top:12px;border:1px solid rgba(232,195,106,.3);background:rgba(232,195,106,.05);border-radius:10px;padding:10px 12px}
.draft small{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.draft p{margin-top:6px;font-size:13px}
.draft footer{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px}
.draft footer span{flex:1}
.draft footer button{background:var(--gold);color:var(--bg);font-weight:700;border-radius:8px;padding:6px 12px;font-size:12px}
.draft footer button.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
.draft.skip{border-color:var(--line);background:rgba(255,255,255,.02)}
.draft.skip small{color:var(--dim)}
.engine{cursor:pointer}.engine:hover{border-color:rgba(255,255,255,.3)}
.engine.ok{border-left:3px solid #6ee7b7}.engine.no{border-left:3px solid #f07167}
.answer h4{margin:14px 0 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.answer p{margin:0;font-size:14px;line-height:1.55}
article header .ico{margin-left:auto}
.gad .eyebrow{display:flex;align-items:center;gap:6px}
.brief-card{cursor:pointer}.brief-card:hover{border-color:rgba(255,255,255,.3)}
.brief-card header b{white-space:normal}
.brief-card .dot{width:8px;height:8px;border-radius:99px;margin-left:auto;flex-shrink:0}
.pols{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pol{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:rgba(255,255,255,.03);min-width:0}
.pol div{display:flex;flex-direction:column;min-width:0}
.pol small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.pol b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#legend{grid-template-columns:1fr 1fr 1fr 1fr}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.tiles.four{grid-template-columns:1fr 1fr 1fr 1fr}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;min-width:0}
.tile.wide{grid-column:1/3;flex-direction:row;align-items:center;flex-wrap:wrap;gap:0 10px}
.tile.wide .spark{margin-left:auto}
.tile.off{opacity:.45}
.tile small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.tile b{font-family:"Hanken Grotesk";font-size:20px;font-weight:800;letter-spacing:-.02em}
.tile em{font-style:normal;font-size:11px;color:var(--mut)}
.tile.wide small,.tile.wide b{flex-basis:100%}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
.bar i{display:block;height:100%}
.barkey{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11px;color:var(--mut)}
.barkey i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px}
.health{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:rgba(244,239,230,.85)}
.health li{display:flex;align-items:center;gap:8px}
table.pages,table.collect{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
table.pages th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:4px 6px;border-bottom:1px solid var(--line)}
table.pages td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.pages tr[data-go]{cursor:pointer}table.pages tr[data-go]:hover td{background:rgba(255,255,255,.04)}
table.pages td:first-child{white-space:normal;min-width:0}
table.pages td b{display:inline;font-family:"DM Sans"}
table.pages td span{display:block;color:var(--dim);font-size:11px}
table.pages .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:6px}
table.collect td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top;color:rgba(244,239,230,.85)}
table.collect td:nth-child(2){color:var(--mut)}table.collect td:nth-child(3){color:var(--dim);white-space:nowrap}
.tag em{font-style:normal;color:var(--dim);margin-left:3px}
#legend{right:16px;bottom:16px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 12px;font-size:11px;color:var(--mut)}
#legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

#drawer{position:absolute;z-index:5;top:16px;right:16px;bottom:16px;width:440px;max-width:calc(100% - 32px);transform:translateX(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:0}
#drawer.open{transform:none}
#drawer-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--mut);font-size:16px}
#drawer-close:hover{color:var(--ink);background:rgba(255,255,255,.12)}
#drawer-body{overflow:auto;padding:20px 20px 28px;scrollbar-width:thin;scrollbar-color:#2a2622 transparent}
#drawer-body h2{margin:4px 0 0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:32px}
#drawer-body h2 .muted{font-size:13px;font-weight:600;color:var(--dim);text-decoration:none}
#drawer-body h3{margin:22px 0 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.eyebrow{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.lead{margin:10px 0 0;color:rgba(244,239,230,.8);font-size:14px}
blockquote{margin:12px 0 0;padding:10px 14px;border-left:2px solid var(--gold);font-family:"Hanken Grotesk";font-size:17px;font-weight:600;line-height:1.3;color:var(--ink)}
.lnk{color:var(--mut);font:inherit;text-transform:inherit;letter-spacing:inherit}
.lnk:hover{color:var(--ink)}
.source{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:12px;color:var(--mut)}
.source .dot{width:7px;height:7px;border-radius:99px;background:#6ee7b7;box-shadow:0 0 8px #6ee7b7}
.source em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(232,195,106,.35);border-radius:99px;padding:1px 7px}
.foot{font-size:12px;color:var(--dim);margin-top:18px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:8px 12px;margin:14px 0 0;font-size:13px}
.kv dt{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-top:2px}
.kv dd{margin:0;color:rgba(244,239,230,.85)}
.tag{display:inline-block;font-size:11px;font-weight:600;background:rgba(255,255,255,.07);border-radius:99px;padding:2px 8px;margin:2px 2px 0 0;color:var(--mut)}
.tag.bad{color:#f07167;background:rgba(240,113,103,.12);text-decoration:line-through}
.tags{margin-top:8px}
.lanes{display:grid;gap:6px}
.lane{display:grid;grid-template-columns:1fr auto;text-align:left;gap:0 8px;padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;background:rgba(255,255,255,.03)}
.lane:hover{background:rgba(255,255,255,.07)}
.lane b{font-size:13px}.lane span{color:var(--dim);font-size:12px}.lane small{grid-column:1/3;color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;background:rgba(255,255,255,.03);transition:.15s}
.chip:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.chips.stack{display:grid;grid-template-columns:1fr 1fr}
.chips.stack .chip{justify-content:flex-start}
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.people li{display:flex;align-items:center;gap:10px}
.people b{display:block;font-size:13px}.people .muted{font-size:12px;color:var(--dim)}
.pav{width:32px;height:32px;border-radius:99px;background:rgba(232,195,106,.18);color:var(--gold);font:800 14px "Hanken Grotesk";display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pav.big{width:42px;height:42px;font-size:18px}
.hooks{margin:0;padding:0 0 0 18px;color:rgba(244,239,230,.8);font-size:13px}
.hooks li{margin:4px 0}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#fff;font:800 14px "Hanken Grotesk";flex-shrink:0}
.glyph{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font:800 13px "Hanken Grotesk"}
.list,.ads{display:grid;gap:12px;margin-top:16px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
article header{display:flex;align-items:center;gap:10px}
article header div{display:flex;flex-direction:column;min-width:0;flex:1}
article header b{font-size:13px;line-height:1.2}
article header span{font-size:12px;color:var(--dim)}
article p{margin:8px 0 0;font-size:13px;color:rgba(244,239,230,.85)}
.facts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim)}
.facts em{font-style:normal;color:var(--mut);margin-left:4px}
.facts .warn{color:#e8b84a}.facts .kind{margin-left:auto;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.ad .status{margin-left:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#6ee7b7;border:1px solid rgba(110,231,183,.35);border-radius:99px;padding:2px 8px}
.ad.inactive .status{color:var(--dim);border-color:var(--line)}
.ad .creative{position:relative;margin-top:10px;aspect-ratio:1.91/1;border-radius:10px;display:flex;align-items:flex-end;padding:14px;overflow:hidden}
.ad .creative .hook{font-family:"Hanken Grotesk";font-weight:800;font-size:20px;line-height:1.1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);max-width:85%;letter-spacing:-.02em}
.ad .creative .fmt{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;border-radius:99px;padding:3px 8px}
.ad .creative .play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:99px;background:rgba(255,255,255,.9);color:#000;display:flex;align-items:center;justify-content:center;font-size:20px;padding-left:4px}
.ad .creative .cards{display:flex;gap:8px;width:100%;align-items:stretch;height:100%}
.ad .creative .card{position:static;flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px;display:flex;align-items:flex-end;font-family:"Hanken Grotesk";font-weight:700;font-size:13px;color:#fff;backdrop-filter:none}
.ad footer{display:flex;align-items:center;gap:10px;margin-top:10px;background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.ad footer div{flex:1;min-width:0;display:flex;flex-direction:column}
.ad footer small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.ad footer b{font-size:14px;font-family:"Hanken Grotesk"}
.ad footer span{font-size:12px;color:var(--mut)}
.ad footer button{background:rgba(255,255,255,.12);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.gad .gh{display:block;font-size:15px;color:#8ab4f8;font-weight:600;margin-top:6px;font-family:"Hanken Grotesk"}
.gu{display:block;font-size:12px;color:#6ee7b7;margin-top:2px}
.post.rd header{flex-wrap:wrap;gap:6px}
.post.rd .sub{font-weight:700;font-size:12px;color:#ff6a3d}
.post.rd .thr{font-size:12px;color:var(--mut)}
.post.rd.promo{border-color:rgba(232,184,74,.3)}
.person .quote{font-style:italic;display:flex;flex-direction:column;gap:2px}
.person .quote small{font-style:normal;color:var(--dim);font-size:11px}
.launch .up{margin-left:auto;font-weight:800;color:#ff8a70;font-family:"Hanken Grotesk";font-size:15px}
.video{display:flex;gap:12px;align-items:center}
.video .thumb{position:relative;width:110px;aspect-ratio:16/9;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.video .thumb em{position:absolute;right:5px;bottom:5px;font-size:10px;font-style:normal;background:rgba(0,0,0,.7);border-radius:4px;padding:1px 5px}
.video div{display:flex;flex-direction:column}
.video b{font-size:13px;line-height:1.3}.video span{font-size:12px;color:var(--dim);margin-top:3px}
.bpost b,.mail b{display:block;font-size:14px;line-height:1.3;font-family:"Hanken Grotesk"}
.mail p{color:var(--mut)}
@media (max-width:760px){
  nav{padding:8px 12px;gap:8px}
  nav #title,nav .mock,nav #fit{display:none}
  nav .ins-btn{padding:5px 8px;font-size:0;gap:0}nav .ins-btn span{font-size:11px;margin-left:4px}
  nav .co input{width:100px}
  #side{left:10px;right:10px;top:10px;width:auto;padding:10px 12px}
  #side h1{font-size:16px}#side p,#side .hint,#side .eyebrow,#search,#lanes{display:none}
  #filters{flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
  .f{flex-shrink:0}
  #legend{display:none}
  #drawer{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-width:none;height:62%;transform:translateY(120%)}
  .chips.stack{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <nav>
    <a class="logo" href="/"><img src="/favicon-32.png" alt="">viewfy</a>
    <span id="title">demo</span>
    <span class="mock">mock data · sep 2026</span>
    <label class="co"><span>company</span><input id="company" spellcheck="false"><button id="build" type="button">Map</button></label>
    <button id="insights" type="button" class="ins-btn"></button>
    <button id="fit" type="button" title="Reset view (0)">Fit</button>
  </nav>
  <div id="map">
    <canvas id="canvas"></canvas>
    <aside id="side" class="card">
      <p class="eyebrow">market map</p>
      <h1>The whole market, one map</h1>
      <p>Buyers asking right now, what the AI engines answer, your own channels, and every competitor with everything they run. Click anything.</p>
      <input id="search" placeholder="Find a competitor, venue, question…" autocomplete="off">
      <div id="filters"></div>
      <p class="eyebrow lanes-h">competitor lanes</p>
      <div id="lanes"></div>
      <p class="hint">Drag to pan · scroll to zoom · Esc closes · 0 fits</p>
    </aside>
    <aside id="drawer" class="card">
      <button id="drawer-close" type="button" aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </aside>
    <div id="legend" class="card"></div>
    <div id="tip"></div>
    <div id="toast"></div>
  </div>
</div>
<script src="/demo/data.js"></script>
<script src="/demo/app.js"></script>
</body>
</html>
